<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PinjamCepat - Aplikasi Pinjaman Harian</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
        }

        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .animate-in { 
            animation: fadeIn 0.4s ease-out; 
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">

    <div id="app">
        <!-- Konten akan dimuat di sini melalui JavaScript -->
    </div>

    <script>
        // State Management Sederhana
        let state = {
            appMode: 'user', // user, admin-login, admin
            activeTab: 'dashboard', // dashboard, apply, history, queue, settings
            isAuthenticated: false,
            config: {
                interestRate: 0.20,
                adminFeeRate: 0.05,
                savingsRate: 0.05,
                appName: "PinjamCepat"
            },
            loans: [
                {
                    id: 'L-001',
                    name: 'Budi Santoso',
                    nik: '3201010101010001',
                    amount: 500000,
                    tenor: 24,
                    status: 'approved',
                    total: 600000,
                    received: 450000,
                    installment: 25000,
                    date: '2024-05-01'
                },
                {
                    id: 'L-002',
                    name: 'Siti Aminah',
                    nik: '3201010101010002',
                    amount: 1000000,
                    tenor: 24,
                    status: 'pending',
                    total: 1200000,
                    received: 900000,
                    installment: 50000,
                    date: '2024-05-03'
                }
            ],
            formData: { name: '', nik: '', amount: '', tenor: '24' }
        };

        // Utilitas Format Mata Uang
        const formatIDR = (val) => new Intl.NumberFormat('id-ID', {
            style: 'currency',
            currency: 'IDR',
            maximumFractionDigits: 0
        }).format(val);

        // Fungsi Render Utama
        function updateView() {
            const app = document.getElementById('app');
            
            if (state.appMode === 'user') {
                renderUserApp(app);
            } else if (state.appMode === 'admin-login') {
                renderAdminLogin(app);
            } else if (state.appMode === 'admin') {
                renderAdminApp(app);
            }
            
            // Re-inisialisasi Ikon Lucide setelah DOM diperbarui
            if (window.lucide) {
                lucide.createIcons();
            }
        }

        // --- KOMPONEN USER ---
        function renderUserApp(container) {
            let content = '';
            
            if (state.activeTab === 'dashboard') {
                content = `
                    <div class="space-y-8 animate-in">
                        <div class="bg-gradient-to-br from-blue-600 to-indigo-700 p-8 rounded-[2.5rem] text-white shadow-xl">
                            <p class="opacity-80 text-sm font-medium">Selamat Datang di ${state.config.appName}</p>
                            <h2 class="text-3xl font-bold mt-1">Butuh Dana Cepat?</h2>
                            <p class="mt-4 text-blue-100 max-w-md">Dapatkan pinjaman harian dengan proses verifikasi instan dan bunga kompetitif.</p>
                            <button onclick="navigate('apply')" class="mt-6 bg-white text-blue-600 px-6 py-3 rounded-xl font-bold shadow-lg active:scale-95 transition-transform hover:bg-blue-50">
                                Ajukan Sekarang
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div class="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm">
                                <i data-lucide="clock" class="text-amber-500 mb-2"></i>
                                <p class="text-xs font-bold text-slate-400 uppercase">Proses</p>
                                <p class="text-xl font-bold text-slate-800">5 Menit</p>
                            </div>
                            <div class="p-6 bg-white rounded-3xl border border-slate-100 shadow-sm">
                                <i data-lucide="shield-check" class="text-emerald-500 mb-2"></i>
                                <p class="text-xs font-bold text-slate-400 uppercase">Keamanan</p>
                                <p class="text-xl font-bold text-slate-800">Terverifikasi</p>
                            </div>
                        </div>
                    </div>
                `;
            } else if (state.activeTab === 'apply') {
                const amount = Number(state.formData.amount || 0);
                const interest = amount * state.config.interestRate;
                const fee = amount * state.config.adminFeeRate;
                const save = amount * state.config.savingsRate;
                const received = amount - (fee + save);
                const total = amount + interest;
                const daily = total / parseInt(state.formData.tenor);

                content = `
                    <div class="animate-in">
                        <h2 class="text-2xl font-bold mb-6">Form Pengajuan Pinjaman</h2>
                        <form onsubmit="handleApply(event)" class="space-y-6">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div class="space-y-1">
                                    <label class="text-xs font-bold text-slate-500 ml-2">Nama Lengkap</label>
                                    <input type="text" placeholder="Masukkan nama sesuai KTP" required class="w-full p-4 bg-white rounded-2xl border outline-none focus:ring-2 focus:ring-blue-500" value="${state.formData.name}" oninput="state.formData.name = this.value">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-xs font-bold text-slate-500 ml-2">NIK</label>
                                    <input type="text" placeholder="16 digit NIK" required class="w-full p-4 bg-white rounded-2xl border outline-none focus:ring-2 focus:ring-blue-500" value="${state.formData.nik}" oninput="state.formData.nik = this.value">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-xs font-bold text-slate-500 ml-2">Jumlah Pinjaman (Rp)</label>
                                    <input type="number" placeholder="Contoh: 1000000" required class="w-full p-4 bg-white rounded-2xl border outline-none focus:ring-2 focus:ring-blue-500" value="${state.formData.amount}" oninput="updateFormAmount(this.value)">
                                </div>
                                <div class="space-y-1">
                                    <label class="text-xs font-bold text-slate-500 ml-2">Tenor (Hari)</label>
                                    <select class="w-full p-4 bg-white rounded-2xl border outline-none focus:ring-2 focus:ring-blue-500" onchange="state.formData.tenor = this.value; updateView()">
                                        <option value="24" ${state.formData.tenor === '24' ? 'selected' : ''}>24 Hari</option>
                                        <option value="30" ${state.formData.tenor === '30' ? 'selected' : ''}>30 Hari</option>
                                    </select>
                                </div>
                            </div>
                            <div class="bg-slate-900 text-white p-6 rounded-3xl space-y-3 shadow-xl">
                                <div class="flex justify-between text-sm opacity-70"><span>Estimasi Cair (Net):</span> <span>${formatIDR(received)}</span></div>
                                <div class="flex justify-between text-sm opacity-70"><span>Total Pengembalian:</span> <span>${formatIDR(total)}</span></div>
                                <div class="flex justify-between font-bold text-lg pt-2 border-t border-slate-800"><span>Cicilan / Hari:</span> <span class="text-blue-400">${formatIDR(daily || 0)}</span></div>
                            </div>
                            <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-bold shadow-lg hover:bg-blue-700 active:scale-[0.98] transition-all">Kirim Pengajuan</button>
                        </form>
                    </div>
                `;
            } else if (state.activeTab === 'history') {
                content = `
                    <div class="animate-in">
                        <h2 class="text-2xl font-bold mb-6">Status Pinjaman Anda</h2>
                        <div class="space-y-4">
                            ${state.loans.length > 0 ? state.loans.map(loan => `
                                <div class="p-5 bg-white border rounded-3xl flex justify-between items-center shadow-sm">
                                    <div class="flex items-center gap-4">
                                        <div class="p-3 rounded-2xl ${loan.status === 'approved' ? 'bg-emerald-50 text-emerald-600' : loan.status === 'rejected' ? 'bg-rose-50 text-rose-600' : 'bg-amber-50 text-amber-600'}">
                                            <i data-lucide="${loan.status === 'approved' ? 'check-circle-2' : loan.status === 'rejected' ? 'x-circle' : 'clock'}"></i>
                                        </div>
                                        <div>
                                            <p class="font-bold text-sm text-slate-800">${formatIDR(loan.amount)}</p>
                                            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-tight">${loan.date} • ${loan.tenor} Hari</p>
                                        </div>
                                    </div>
                                    <span class="text-[10px] font-black px-3 py-1 rounded-full uppercase ${loan.status === 'approved' ? 'bg-emerald-100 text-emerald-700' : loan.status === 'rejected' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}">
                                        ${loan.status}
                                    </span>
                                </div>
                            `).join('') : '<p class="text-center py-10 text-slate-400 font-medium">Belum ada riwayat pengajuan</p>'}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="min-h-screen pb-24 md:pb-0">
                    <div class="p-6 flex justify-between items-center bg-white border-b md:hidden sticky top-0 z-10">
                        <h1 class="font-bold text-blue-600 text-xl tracking-tight">${state.config.appName}</h1>
                        <button onclick="changeMode('admin-login')" class="p-2 bg-slate-100 rounded-full text-slate-600"><i data-lucide="lock" class="w-5 h-5"></i></button>
                    </div>
                    <div class="flex">
                        <nav class="hidden md:flex flex-col w-64 h-screen bg-white border-r p-6 sticky top-0">
                            <h1 class="text-2xl font-black text-blue-600 mb-10 tracking-tighter">${state.config.appName}</h1>
                            <div class="space-y-2">
                                <button onclick="navigate('dashboard')" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold transition-all ${state.activeTab === 'dashboard' ? 'bg-blue-50 text-blue-600' : 'text-slate-500 hover:bg-slate-50'}"><i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard</button>
                                <button onclick="navigate('apply')" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold transition-all ${state.activeTab === 'apply' ? 'bg-blue-50 text-blue-600' : 'text-slate-500 hover:bg-slate-50'}"><i data-lucide="plus-circle" class="w-5 h-5"></i> Ajukan Pinjaman</button>
                                <button onclick="navigate('history')" class="w-full flex items-center gap-3 p-3 rounded-xl font-bold transition-all ${state.activeTab === 'history' ? 'bg-blue-50 text-blue-600' : 'text-slate-500 hover:bg-slate-50'}"><i data-lucide="history" class="w-5 h-5"></i> Riwayat</button>
                            </div>
                            <button onclick="changeMode('admin-login')" class="mt-auto flex items-center gap-2 p-3 text-slate-400 hover:text-blue-600 text-sm font-bold transition-colors">
                                <i data-lucide="lock" class="w-4 h-4"></i> Akses Administrator
                            </button>
                        </nav>
                        <main class="flex-1 p-6 md:p-12 max-w-4xl mx-auto">${content}</main>
                    </div>
                    <!-- Mobile Nav -->
                    <nav class="fixed bottom-0 w-full bg-white border-t flex justify-around p-4 md:hidden shadow-2xl z-20">
                        <button onclick="navigate('dashboard')" class="p-2 transition-colors ${state.activeTab === 'dashboard' ? 'text-blue-600' : 'text-slate-400'}"><i data-lucide="layout-dashboard"></i></button>
                        <button onclick="navigate('apply')" class="p-2 transition-colors ${state.activeTab === 'apply' ? 'text-blue-600' : 'text-slate-400'}"><i data-lucide="plus-circle"></i></button>
                        <button onclick="navigate('history')" class="p-2 transition-colors ${state.activeTab === 'history' ? 'text-blue-600' : 'text-slate-400'}"><i data-lucide="history"></i></button>
                    </nav>
                </div>
            `;
        }

        // --- KOMPONEN ADMIN LOGIN ---
        function renderAdminLogin(container) {
            container.innerHTML = `
                <div class="min-h-screen bg-slate-900 flex items-center justify-center p-6">
                    <div class="bg-white w-full max-w-md p-10 rounded-[3rem] shadow-2xl animate-in">
                        <button onclick="changeMode('user')" class="mb-6 flex items-center gap-2 text-slate-400 hover:text-slate-800 font-bold transition-colors">
                            <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali
                        </button>
                        <div class="text-center mb-8">
                            <div class="w-20 h-20 bg-blue-50 text-blue-600 rounded-[2rem] flex items-center justify-center mx-auto mb-4">
                                <i data-lucide="shield-lock" class="w-8 h-8"></i>
                            </div>
                            <h2 class="text-2xl font-black text-slate-800">Admin Portal</h2>
                            <p class="text-sm text-slate-400">Gunakan kredensial resmi untuk masuk.</p>
                        </div>
                        <form onsubmit="handleAdminLogin(event)" class="space-y-4">
                            <input type="text" id="adminUser" placeholder="Username" required class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 font-bold border-none">
                            <input type="password" id="adminPin" placeholder="PIN Keamanan" required class="w-full p-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-blue-600 font-bold border-none">
                            <button type="submit" class="w-full bg-blue-600 text-white py-5 rounded-2xl font-black uppercase tracking-widest text-xs shadow-lg hover:bg-blue-700 transition-all">Verifikasi Akses</button>
                        </form>
                    </div>
                </div>
            `;
        }

        // --- KOMPONEN ADMIN APP ---
        function renderAdminApp(container) {
            let content = '';
            
            if (state.activeTab === 'queue') {
                const pendingLoans = state.loans.filter(l => l.status === 'pending');
                content = `
                    <div class="animate-in">
                        <div class="mb-8 flex justify-between items-end">
                            <div>
                                <h2 class="text-3xl font-black text-slate-800 uppercase tracking-tighter">Antrean Verifikasi</h2>
                                <p class="text-slate-500">Terdapat ${pendingLoans.length} permohonan baru hari ini.</p>
                            </div>
                        </div>
                        <div class="bg-white rounded-[2rem] shadow-sm border border-slate-200 overflow-hidden">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left">
                                    <thead class="bg-slate-50 border-b border-slate-100">
                                        <tr class="text-[10px] font-black text-slate-400 uppercase tracking-widest">
                                            <th class="px-6 py-4">Nasabah</th>
                                            <th class="px-6 py-4">Nominal Pinjaman</th>
                                            <th class="px-6 py-4">Status</th>
                                            <th class="px-6 py-4 text-right">Aksi Tindakan</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-50">
                                        ${pendingLoans.map(loan => `
                                            <tr class="hover:bg-slate-50/50 transition-colors">
                                                <td class="px-6 py-5">
                                                    <p class="font-bold text-slate-800">${loan.name}</p>
                                                    <p class="text-[10px] text-slate-400 font-mono">${loan.nik}</p>
                                                </td>
                                                <td class="px-6 py-5">
                                                    <p class="font-black text-blue-600">${formatIDR(loan.amount)}</p>
                                                    <p class="text-[10px] text-slate-400 font-bold">${loan.tenor} HARI</p>
                                                </td>
                                                <td class="px-6 py-5">
                                                    <span class="bg-amber-100 text-amber-700 text-[10px] font-black px-3 py-1 rounded-full uppercase">Menunggu</span>
                                                </td>
                                                <td class="px-6 py-5 text-right space-x-2">
                                                    <button onclick="updateLoanStatus('${loan.id}', 'approved')" class="bg-emerald-600 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-emerald-700 shadow-sm transition-colors">Setujui</button>
                                                    <button onclick="updateLoanStatus('${loan.id}', 'rejected')" class="bg-rose-500 text-white px-4 py-2 rounded-xl text-xs font-bold hover:bg-rose-600 shadow-sm transition-colors">Tolak</button>
                                                </td>
                                            </tr>
                                        `).join('')}
                                    </tbody>
                                </table>
                            </div>
                            ${pendingLoans.length === 0 ? '<div class="p-20 text-center text-slate-300 font-bold">Tidak ada antrean tertunda</div>' : ''}
                        </div>
                    </div>
                `;
            } else if (state.activeTab === 'settings') {
                content = `
                    <div class="max-w-2xl animate-in">
                        <h2 class="text-2xl font-bold mb-6">Konfigurasi Parameter Sistem</h2>
                        <div class="bg-white p-8 rounded-[2rem] shadow-sm border space-y-6">
                            <div>
                                <label class="text-xs font-black text-slate-400 uppercase block mb-2">Nama Aplikasi Branding</label>
                                <input type="text" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-none focus:ring-2 focus:ring-blue-500" value="${state.config.appName}" oninput="state.config.appName = this.value">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="text-xs font-black text-slate-400 uppercase block mb-2">Bunga (0.2 = 20%)</label>
                                    <input type="number" step="0.01" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-none focus:ring-2 focus:ring-blue-500" value="${state.config.interestRate}" oninput="state.config.interestRate = parseFloat(this.value)">
                                </div>
                                <div>
                                    <label class="text-xs font-black text-slate-400 uppercase block mb-2">Biaya Admin (0.05 = 5%)</label>
                                    <input type="number" step="0.01" class="w-full p-4 bg-slate-50 rounded-2xl border-none font-bold outline-none focus:ring-2 focus:ring-blue-500" value="${state.config.adminFeeRate}" oninput="state.config.adminFeeRate = parseFloat(this.value)">
                                </div>
                            </div>
                            <button onclick="handleSaveConfig()" class="w-full bg-slate-900 text-white py-4 rounded-2xl font-bold flex items-center justify-center gap-2 shadow-xl hover:bg-black transition-all">
                                <i data-lucide="save" class="w-5 h-5"></i> Simpan Perubahan
                            </button>
                        </div>
                    </div>
                `;
            }

            container.innerHTML = `
                <div class="min-h-screen bg-slate-50 flex">
                    <aside class="w-64 bg-slate-900 text-white flex flex-col p-6 sticky top-0 h-screen overflow-y-auto">
                        <div class="flex items-center gap-2 mb-10 text-blue-400">
                            <i data-lucide="shield-check" class="w-7 h-7"></i>
                            <span class="font-black text-xl tracking-tighter">ADMIN PANEL</span>
                        </div>
                        <nav class="space-y-2 flex-1">
                            <button onclick="navigate('queue')" class="w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold transition-all ${state.activeTab === 'queue' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}"><i data-lucide="inbox" class="w-4 h-4"></i> Permohonan</button>
                            <button onclick="navigate('settings')" class="w-full flex items-center gap-3 p-3 rounded-xl text-sm font-bold transition-all ${state.activeTab === 'settings' ? 'bg-blue-600 text-white' : 'text-slate-400 hover:bg-slate-800'}"><i data-lucide="settings" class="w-4 h-4"></i> Konfigurasi</button>
                        </nav>
                        <div class="pt-6 border-t border-slate-800 space-y-2">
                            <button onclick="changeMode('user')" class="w-full flex items-center gap-3 p-3 text-sm font-bold text-blue-400 hover:bg-blue-500/10 rounded-xl transition-all">
                                <i data-lucide="layout-dashboard" class="w-4 h-4"></i> Lihat Web
                            </button>
                            <button onclick="logout()" class="w-full flex items-center gap-3 p-3 text-sm font-bold text-rose-400 hover:bg-rose-500/10 rounded-xl transition-all">
                                <i data-lucide="log-out" class="w-4 h-4"></i> Keluar Sesi
                            </button>
                        </div>
                    </aside>
                    <main class="flex-1 p-8 overflow-y-auto">${content}</main>
                </div>
            `;
        }

        // --- HANDLER FUNGSI ---

        function navigate(tab) {
            state.activeTab = tab;
            updateView();
        }

        function changeMode(mode) {
            state.appMode = mode;
            if (mode === 'admin' && !state.isAuthenticated) {
                state.appMode = 'admin-login';
            }
            if (mode === 'admin') state.activeTab = 'queue';
            if (mode === 'user') state.activeTab = 'dashboard';
            updateView();
        }

        function updateFormAmount(val) {
            state.formData.amount = val;
            updateView();
        }

        function handleApply(e) {
            e.preventDefault();
            const amount = Number(state.formData.amount);
            const tenor = parseInt(state.formData.tenor);
            const interest = amount * state.config.interestRate;
            
            const newLoan = {
                id: `L-${Math.floor(Math.random() * 1000).toString().padStart(3, '0')}`,
                name: state.formData.name,
                nik: state.formData.nik,
                amount: amount,
                tenor: tenor,
                status: 'pending',
                total: amount + interest,
                received: amount - (amount * (state.config.adminFeeRate + state.config.savingsRate)),
                installment: (amount + interest) / tenor,
                date: new Date().toLocaleDateString('id-ID')
            };
            
            state.loans = [newLoan, ...state.loans];
            state.formData = { name: '', nik: '', amount: '', tenor: '24' };
            navigate('history');
        }

        function handleAdminLogin(e) {
            e.preventDefault();
            const user = document.getElementById('adminUser').value;
            const pin = document.getElementById('adminPin').value;
            
            // Kredensial statis (disarankan dipindah ke backend jika sungguhan)
            if (user === 'abadilestarimandiri' && pin === '240991') {
                state.isAuthenticated = true;
                changeMode('admin');
            } else {
                alert("Kredensial salah atau tidak terdaftar!");
            }
        }

        function handleSaveConfig() {
            alert('Konfigurasi sistem berhasil diperbarui!');
            navigate('queue');
        }

        function updateLoanStatus(id, status) {
            state.loans = state.loans.map(l => l.id === id ? {...l, status} : l);
            updateView();
        }

        function logout() {
            state.isAuthenticated = false;
            changeMode('user');
        }

        // Jalankan saat window dimuat
        window.addEventListener('DOMContentLoaded', updateView);
    </script>
</body>
</html>
